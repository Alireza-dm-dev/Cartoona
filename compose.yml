# Cartoona — local / prod-like Docker run (V0.1.35; PostgreSQL V0.1.37;
# backend V0.1.40)
#
# Three services:
#   frontend  the Next.js web app (was `app` before V0.1.40). Its data, auth and
#             storage still come from the EXTERNAL Supabase project, except GET
#             /api/creation-pricing (V0.1.41), which its server calls on the
#             backend at BACKEND_INTERNAL_URL. It holds NO database credential.
#   backend   the Fastify API (backend/). It reads the local PostgreSQL as a
#             restricted login role and is called by the frontend's server only
#             (never by the browser). Published on loopback only, for debugging.
#   postgres  local PostgreSQL 17 with the plain schema (database/migrations).
# There is still no Supabase CLI, auth or storage emulator. See docs/DOCKER.md
# and docs/BACKEND.md.
#
# No credential appears in this file. Frontend runtime values come from
# .env.docker (env_file). Postgres and backend values are interpolated from the
# shell / --env-file, so neither container receives the frontend's Supabase
# secrets, and the backend never receives the database OWNER password: its
# DATABASE_URL is BACKEND_DATABASE_URL, a cartoona_app login role. All of it
# lives in .env.docker, created from .env.docker.example and gitignored.

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      # Only NEXT_PUBLIC_* values exist at build time (Next inlines them into
      # the browser bundle). They are read from the operator's environment —
      # nothing is hard-coded, and no secret is ever passed as a build arg.
      # Empty is a valid build; see docs/DOCKER.md for how to supply them.
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    image: cartoona-app:local
    # Runtime configuration, including every secret. `required: false` so
    # `docker compose up --build` still works before the file exists — the app
    # then starts and serves /api/health, and only Supabase-backed pages fail.
    env_file:
      - path: .env.docker
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Must stay 0.0.0.0, or the published port cannot reach the app.
      HOSTNAME: 0.0.0.0
      # Server-to-server address of the backend (V0.1.41): the compose service
      # name, on the compose network. Fixed here on purpose (not interpolated),
      # and not NEXT_PUBLIC_*, so it never reaches the browser bundle.
      BACKEND_INTERNAL_URL: http://backend:4000
      BACKEND_REQUEST_TIMEOUT_MS: ${BACKEND_REQUEST_TIMEOUT_MS:-3000}
      # `env_file` hands the frontend the WHOLE .env.docker, which also holds the
      # database owner password and the backend's login role. `environment`
      # wins over `env_file`, so each is blanked here: the frontend process never
      # sees a database credential. Add any new database variable to this list
      # (a static test checks the template against it).
      POSTGRES_DB: ""
      POSTGRES_USER: ""
      POSTGRES_PASSWORD: ""
      DATABASE_URL: ""
      LOCAL_DATABASE_URL: ""
      CARTOONA_APP_DB_PASSWORD: ""
      BACKEND_DATABASE_URL: ""
    ports:
      - "3000:3000"
    # PID 1 reaper, so stray children cannot keep the container alive after
    # SIGTERM. Next itself receives the signal directly (`node server.js`).
    init: true
    # Local/prod-like: comes back after a crash or a Docker restart, but a
    # deliberate `docker compose down` stays down.
    restart: unless-stopped
    # Liveness of the web process only — runs Node inside the container, so no
    # curl/wget is needed, and never checks Supabase.
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # No `depends_on: backend`, on purpose: the web process and every page that
    # does not use the backend must start and stay healthy while it is down.
    # /api/creation-pricing answers its own safe 503 until the backend is ready.
    # Logs go to stdout/stderr (the V0.1.30 JSON logger) and are read with
    # `docker compose logs`; nothing is written to a log file in the container.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Fastify backend (V0.1.40). The frontend's server calls it (V0.1.41) but does
  # not depend on it at startup, so a missing database password or an unhealthy
  # backend never stops the web app.
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: cartoona-backend:local
    # No env_file on purpose: the backend gets exactly these variables and
    # nothing from .env.docker's frontend secrets.
    environment:
      NODE_ENV: production
      BACKEND_PORT: "4000"
      # Must stay 0.0.0.0 inside the container, or the published port cannot
      # reach it. Exposure is limited by the loopback port binding below.
      BACKEND_HOST: 0.0.0.0
      # A cartoona_app LOGIN role (scripts/db/app-login-role.sh), never the
      # owner. Empty => the backend refuses to start; /ready also refuses an
      # owner or superuser session.
      DATABASE_URL: ${BACKEND_DATABASE_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Loopback only: for curl/debugging from this Mac. The frontend will reach
    # it as http://backend:4000 on the compose network, never via the host.
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    # No `init`: Node runs as PID 1 and handles SIGTERM itself (server.ts).
    restart: unless-stopped
    # Liveness only (GET /health, no database).
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Local PostgreSQL 17 (V0.1.37). The frontend does not depend on it, so a
  # missing password or an unhealthy database never stops the web app from
  # starting; only the backend waits for it.
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cartoona}
      POSTGRES_USER: ${POSTGRES_USER:-cartoona}
      # No default on purpose. Left empty, the image refuses to initialise
      # instead of creating a passwordless superuser — and it is never "trust".
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      # Password auth on the Unix socket too, not just TCP (the image defaults
      # local socket connections to trust).
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
      # Lets `docker compose exec postgres psql ...` authenticate. Same secret,
      # same container — nothing new is exposed.
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
    # Reachable from this Mac only (psql, migrations, debugging), never from
    # the LAN. 5433 avoids a natively installed PostgreSQL on 5432. Containers
    # on the compose network use postgres:5432.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    # Over TCP (-h 127.0.0.1) so the probe cannot pass early: during first-run
    # initialisation the image's temporary server listens on the socket only.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Survives `docker compose down`; removed only by `docker compose down -v`.
  # Fixed name so it does not depend on the checkout directory's name.
  postgres_data:
    name: cartoona_postgres_data
